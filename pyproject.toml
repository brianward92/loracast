[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loracast"
version = "0.1.0"
description = "LoRACast — build and evaluate LoRA adapters from podcast transcripts"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Brian Ward", email = "brian.ward.92@gmail.com" }]
dependencies = []

[project.optional-dependencies]
asr = ["faster-whisper"]
youtube = ["yt-dlp"]
train = ["mlx-lm", "pyyaml"]
api = ["anthropic"]
dev = ["pytest"]

[project.scripts]
loracast = "loracast.cli:main"

[tool.setuptools.packages.find]
include = ["loracast*"]

[tool.setuptools.package-data]
"loracast.extract" = ["prompt.md"]
"loracast.train" = ["lora_default.yaml", "eval_prompts.txt"]
